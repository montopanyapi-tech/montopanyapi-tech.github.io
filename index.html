<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montopan Müstakil Ev Simülatörü</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 5px;
            background-color: #0f172a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #f1f5f9;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }
        #app-wrapper {
            width: 100%;
            max-width: 1200px; background: #1e293b; padding: 10px;
            border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        /* 2 SÜTUNLU YERLEŞİM */
        #visualizer-workspace {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 10px;
            align-items: start;
        }

        #left-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        /* UYGULAMA BAŞLIĞI STİLİ */
        .app-title-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }
        .app-title-box h2 {
            margin: 0;
            font-size: 13px;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: block; width: 100%; padding: 8px; cursor: pointer;
            background: #334155; color: #fff; border: 1.5px dashed #38bdf8;
            border-radius: 5px; font-weight: 600; font-size: 12px; text-align: center;
            transition: all 0.2s;
        }
        .custom-file-upload:hover { background: #38bdf8; color: #0f172a; border-style: solid; }
        
        .clear-button {
            width: 100%; background: #475569; border: none; color: #f1f5f9; padding: 7px;
            border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;
            transition: all 0.2s;
        }
        .clear-button:hover { background: #dc2626; color: white; }

        #file-status { font-size: 11px; color: #94a3b8; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ÖLÇEKLENDİRME KONTROL ALANI */
        .scale-control-box {
            display: flex; flex-direction: column; gap: 6px; background: #1e293b; padding: 8px; border-radius: 5px; border: 1px solid #334155;
        }
        .scale-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; }
        .scale-row input[type="range"] { width: 110px; accent-color: #38bdf8; cursor: pointer; }
        .scale-val { color: #38bdf8; font-weight: bold; min-width: 30px; text-align: right; }

        .exit-link {
            display: block; width: 100%; padding: 8px; background: #ef4444; color: white;
            border: none; font-weight: bold; font-size: 12px; border-radius: 5px;
            transition: all 0.2s; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
            cursor: pointer; text-align: center;
        }
        .exit-link:hover { background: #b91c1c; }

        /* CANLI SAHNE ALANI */
        #stage-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
        }
        #base-house {
            display: block;
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* KAPLAMA MASKELERI */
        .wall-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.95;
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        /* 1. KATMAN: SOL ANA DUVAR */
        .wall-left-main {
            clip-path: polygon(
                10.0% 34.6%, 50.8% 34.6%, 50.8% 65.4%, 10.0% 65.4%, 10.0% 34.6%,
                18.1% 39.5%, 18.1% 56.4%, 26.6% 56.4%, 26.6% 39.5%, 18.1% 39.5%,
                10.0% 34.6%,
                34.7% 39.5%, 34.7% 56.4%, 43.1% 56.4%, 43.1% 39.5%, 34.7% 39.5%,
                10.0% 34.6%
            );
        }

        /* 2. KATMAN: SAG ARKA VERANDA DUVARI */
        .wall-veranda-back {
            clip-path: polygon(
                64.2% 38.0%, 91.6% 38.0%, 91.6% 63.6%, 64.2% 63.6%, 64.2% 38.0%,
                68.4% 41.5%, 68.4% 62.4%, 80.3% 62.4%, 80.3% 41.5%, 68.4% 41.5%
            );
        }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) {
            #visualizer-workspace { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="visualizer-workspace">
            <!-- SOL TARAF: KONTROL PANELİ -->
            <div id="left-controls">
                <!-- UYGULAMA BAŞLIĞI -->
                <div class="app-title-box">
                    <h2>Montopan Müstakil Ev Simülatörü</h2>
                </div>

                <div class="control-group" style="margin-top: 4px;">
                    <label for="panelInput" class="custom-file-upload">📁 Panel Seç</label>
                    <input type="file" id="panelInput" accept="image/*">
                    <span id="file-status">Seçilmedi</span>
                </div>

                <div class="control-group">
                    <button type="button" class="clear-button" onclick="clearPanel()">✕ Paneli Temizle</button>
                </div>

                <hr style="border: 0; border-top: 1px solid #334155; margin: 2px 0;">

                <!-- ÖLÇEK ÇUBUKLARI -->
                <div class="scale-control-box">
                    <div class="scale-row">
                        <span>Yatay:</span>
                        <input type="range" id="scaleX" min="40" max="600" value="180" oninput="updateScale()">
                        <span id="valX" class="scale-val">180px</span>
                    </div>
                    <div class="scale-row">
                        <span>Dikey:</span>
                        <input type="range" id="scaleY" min="40" max="600" value="180" oninput="updateScale()">
                        <span id="valY" class="scale-val">180px</span>
                    </div>
                </div>

                <div class="control-group" style="margin-top: auto;">
                    <button type="button" class="exit-link" onclick="closeOrRedirect()">🚪 Geri Dön</button>
                </div>
            </div>

            <!-- SAĞ TARAF: EV SAHNESİ -->
            <div id="stage-wrapper">
                <img src="house.jpg" id="base-house" alt="Demo Ev">
                <div class="wall-overlay wall-left-main"></div>
                <div class="wall-overlay wall-veranda-back"></div>
            </div>
        </div>
    </div>

<script>
function closeOrRedirect() {
    window.close();
    setTimeout(function() {
        window.location.href = "https://www.montopan.com/ana-sayfa";
    }, 100);
}

document.getElementById("panelInput").addEventListener("change", function(e) {
    if (!e.target.files || e.target.files.length === 0) return;
    
    const file = e.target.files[0];
    document.getElementById("file-status").innerText = file.name;

    const reader = new FileReader();
    reader.onload = function(evt) {
        const wallOverlays = document.querySelectorAll(".wall-overlay");
        wallOverlays.forEach(function(wall) {
            wall.style.backgroundImage = "url('" + evt.target.result + "')";
        });
    }
    reader.readAsDataURL(file);
});

function updateScale() {
    const xVal = document.getElementById("scaleX").value;
    const yVal = document.getElementById("scaleY").value;
    
    document.getElementById("valX").innerText = xVal + "px";
    document.getElementById("valY").innerText = yVal + "px";
    
    const wallOverlays = document.querySelectorAll(".wall-overlay");
    wallOverlays.forEach(function(wall) {
        wall.style.backgroundSize = xVal + "px " + yVal + "px";
    });
}

function clearPanel() {
    const wallOverlays = document.querySelectorAll(".wall-overlay");
    wallOverlays.forEach(function(wall) {
        wall.style.backgroundImage = "none";
    });
    
    document.getElementById("file-status").innerText = "Seçilmedi";
    document.getElementById("panelInput").value = "";
    
    document.getElementById("scaleX").value = 180;
    document.getElementById("scaleY").value = 180;
    document.getElementById("valX").innerText = "180px";
    document.getElementById("valY").innerText = "180px";
    
    updateScale();
}
</script>
</body>
</html>
