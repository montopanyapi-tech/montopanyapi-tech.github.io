<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montopan Panel Sistemleri</title>
    <style>
        html, body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: transparent; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-container { 
            display: flex; 
            width: 85vw; 
            height: 65vh; 
            background: #111827; 
            color: #f3f4f6; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* Sol Bölüm: GitHub'dan Otomatik Gelen Panel Menüsü */
        .sidebar { flex: 3; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #1f2937; overflow-y: auto; box-sizing: border-box; border-right: 2px solid #374151; }
        .sidebar h3 { margin: 0 0 5px 0; font-size: 16px; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; color: #38bdf8; }
        
        .panel-btn {
            background: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .panel-btn:hover { background: #2563eb; border-color: #38bdf8; }
        
        /* Sağ Bölüm: Dijital Duvar Alanı */
        .wall-zone { flex: 7; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; box-sizing: border-box; }
        .wall-canvas { width: 100%; height: 90%; border: 3px dashed #4b5563; border-radius: 12px; background: #1f2937; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 15px; color: #9ca3af; box-shadow: inset 0 4px 20px rgba(0,0,0,0.5); padding: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SOL BÖLÜM: GİTHUB'DAN GELEN MODELLER -->
    <div class="sidebar" id="menuArea">
        <h3>MONTOPAN PANEL SEÇİN</h3>
        <!-- Modeller buraya otomatik yüklenecektir -->
    </div>

    <!-- SAĞ BÖLÜM: OTOMATİK DUVAR ÖNİZLEME -->
    <div class="wall-zone">
        <div class="wall-canvas" id="dropZone">
            Soldaki Menüden Bir Model Seçin.<br>Duvar Otomatik Örülecektir.
        </div>
    </div>

</div>

<script>
    const githubKullaniciAdi = "montopanyapi-tech";
    const depoAdi = "montopanyapi-tech.github.io";
    const klasorAdi = "dogal-tas"; 

    const menuArea = document.getElementById('menuArea');
    const dropZone = document.getElementById('dropZone');

    const apiUrl = `https://github.com{githubKullaniciAdi}/${depoAdi}/contents/${klasorAdi}`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            if (Array.isArray(data)) {
                data.forEach(file => {
                    if (file.name.match(/\.(jpg|jpeg|png)$/i)) {
                        const btn = document.createElement('button');
                        btn.className = 'panel-btn';
                        
                        // Hatalı fonksiyon düzeltildi: Uzantıyı atıp tireleri temizler
                        const temizAd = file.name.substring(0, file.name.lastIndexOf('.'));
                        const modelIsmi = temizAd.replace(/-/g, ' ');
                        
                        btn.innerText = `🧱 ${modelIsmi}`;
                        btn.onclick = () => applyWallTexture(file.download_url);
                        menuArea.appendChild(btn);
                    }
                });
            } else {
                menuArea.innerHTML += `<p style="color:#ef4444; font-size:11px;">Klasör boş veya bulunamadı.</p>`;
            }
        })
        .catch(err => {
            menuArea.innerHTML += `<p style="color:#ef4444; font-size:11px;">Bağlantı Kurulamadı.</p>`;
        });

    function applyWallTexture(imgUrl) {
        dropZone.innerHTML = ''; 
        dropZone.style.backgroundImage = `url('${imgUrl}')`;
        dropZone.style.backgroundRepeat = 'repeat'; 
        dropZone.style.backgroundSize = '200px 100px'; 
    }
</script>

</body>
</html>
