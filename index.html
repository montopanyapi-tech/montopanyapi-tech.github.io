<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montopan Cephe Visualizer v12.2</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f172a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #f1f5f9;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        #app-wrapper {
            width: 1200px; background: #1e293b; padding: 20px;
            border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            position: relative;
            z-index: 10; /* Bizim panelimizi tiiny.host kodlarından yukarı taşır */
        }
        #top-control-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; padding: 15px 25px;
            border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155;
            position: relative;
            z-index: 20;
        }
        .control-group { display: flex; align-items: center; gap: 15px; position: relative; z-index: 30; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: inline-block; padding: 12px 24px; cursor: pointer;
            background: #334155; color: #fff; border: 2px dashed #38bdf8;
            border-radius: 6px; font-weight: 600; font-size: 15px; transition: all 0.2s;
            position: relative;
            z-index: 40;
        }
        .custom-file-upload:hover { background: #38bdf8; color: #0f172a; border-style: solid; }
        #file-status { font-size: 13px; color: #94a3b8; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .exit-link {
            display: inline-block; padding: 12px 20px; background: #ef4444; color: white;
            text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 6px;
            transition: all 0.2s; box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
        }
        .exit-link:hover { background: #b91c1c; transform: translateY(-1px); }

        /* CANLI SAHNE ALANI */
        #stage-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
        }
        #base-house {
            display: block;
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* KAPLAMA MASKELERI */
        .wall-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.95;
            background-repeat: repeat;
            background-size: 180px auto;
        }

        /* 1. KATMAN: SOL ANA DUVAR */
        .wall-left-main {
            clip-path: polygon(
                10.0% 34.6%, 50.8% 34.6%, 50.8% 65.4%, 10.0% 65.4%, 10.0% 34.6%,
                18.1% 39.5%, 18.1% 56.4%, 26.6% 56.4%, 26.6% 39.5%, 18.1% 39.5%,
                10.0% 34.6%,
                34.7% 39.5%, 34.7% 56.4%, 43.1% 56.4%, 43.1% 39.5%, 34.7% 39.5%,
                10.0% 34.6%
            );
        }

        /* 2. KATMAN: SAG ARKA VERANDA DUVARI */
        .wall-veranda-back {
            clip-path: polygon(
                64.2% 38.0%, 91.6% 38.0%, 91.6% 63.6%, 64.2% 63.6%, 64.2% 38.0%,
                68.4% 41.5%, 68.4% 62.4%, 80.3% 62.4%, 80.3% 41.5%, 68.4% 41.5%
            );
        }

        /* SADECE MOR REKLAM BARINI HEDEFLEYEN GÜVENLI GIZLEME KODU */
        iframe[id*="tiiny"], 
        .tiiny-branding,
        a[href*="tiiny.host"],
        div[style*="background-color: rgb(123, 31, 162)"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="top-control-bar">
            <div class="control-group">
                <label for="panelInput" class="custom-file-upload">📁 Panel Seç (Resim Çağır)</label>
                <input type="file" id="panelInput" accept="image/*">
                <span id="file-status">Panel Seçilmedi</span>
            </div>
            
            <div class="control-group">
                <a href="https://www.montopan.com/duvar-tasar%C4%B1m%C4%B1-yap" class="exit-link">🚪 Geri Dön</a>
            </div>
        </div>

        <div id="stage-wrapper">
            <img src="house.jpg" id="base-house" alt="Demo Ev">
            <div class="wall-overlay wall-left-main"></div>
            <div class="wall-overlay wall-veranda-back"></div>
        </div>
    </div>

<script>
// Butonun kilitlenmesini kesin olarak çözen, tıklamaları en üste alan kod yapısı
document.getElementById("panelInput").addEventListener("change", function(e) {
    if (!e.target.files || e.target.files.length === 0) return;
    
    const file = e.target.files[0]; // Liste yerine net tekil dosya çağrıldı
    document.getElementById("file-status").innerText = file.name;

    const reader = new FileReader();
    reader.onload = function(evt) {
        const wallOverlays = document.querySelectorAll(".wall-overlay");
        wallOverlays.forEach(function(wall) {
            wall.style.backgroundImage = "url('" + evt.target.result + "')";
        });
    }
    reader.readAsDataURL(file);
});
</script>
</body>
</html>
